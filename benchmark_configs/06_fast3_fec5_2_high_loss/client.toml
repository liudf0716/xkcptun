# ========================================================
# 模式 6: 高抗丢包配置 (fast3 + FEC 5:2, 40% 冗余, 适合恶劣弱网) - 客户端配置 (client.toml)
# ========================================================
[global]
syslog = false
mon_port = 9085
remote_addr = "172.96.252.145"
remote_port = 9089
mode = "fast3"
fec = 1
sndwnd = 1024
rcvwnd = 1024
data_shard = 5
parity_shard = 2
pacing = 128
loss_ctrl = 0
sock_buf = 4194304

[[tunnel]]
name = "host_ssh_tunnel"
local_interface = "127.0.0.1"
local_port = 2222
target_port = 27334
target_addr = "127.0.0.1"
