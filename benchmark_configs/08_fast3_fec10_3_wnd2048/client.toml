# ========================================================
# 模式 8: 超大窗口 (fast3 + FEC 10:3, 窗口 2048, 适合大带宽骨干) - 客户端配置 (client.toml)
# ========================================================
[global]
syslog = false
mon_port = 9085
remote_addr = "172.96.252.145"
remote_port = 9089
mode = "fast3"
fec = 1
sndwnd = 2048
rcvwnd = 2048
data_shard = 10
parity_shard = 3
pacing = 0
loss_ctrl = 0
sock_buf = 4194304

[[tunnel]]
name = "host_ssh_tunnel"
local_interface = "127.0.0.1"
local_port = 2222
target_port = 27334
target_addr = "127.0.0.1"
